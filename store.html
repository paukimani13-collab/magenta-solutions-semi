<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Store | Magenta Solutions</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .filter-btn { background:var(--card); }
    .store-search { max-width:1000px; margin:0 auto 28px; padding:22px; }
    .store-search h2 { margin:0 0 16px; font-size:1.25rem; }
    .store-search-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:14px; align-items:end; }
    .store-search-grid .form-group { margin:0; }
    .store-search-grid label { display:block; margin-bottom:6px; color:var(--text-muted); font-weight:600; }
    .store-search-grid input, .store-search-grid select { width:100%; min-height:44px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--navy); color:var(--text); }
    .store-search-actions { display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-top:14px; }
    @media (max-width:600px) { .store-search { padding:16px; } }
  </style>
</head>
<body>
  <header class="header">
    <div class="container nav">
      <a href="index.html" class="logo"><img class="brand-logo" src="logos/MagentaLogo.png" alt=""><span>MAGENTA COMPUTERS</span></a>
      <nav class="nav-links">
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="store.html" class="active">Store</a>
        <a href="about.html">About</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
        <a href="services.html#booking" class="btn btn-primary btn-sm nav-cta">Book Repair</a>
      </nav>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="cart-btn" aria-label="Open cart"><svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 4h2l2.2 11.2a2 2 0 0 0 2 1.6h8.6a2 2 0 0 0 1.9-1.4L22 9H6"/><circle cx="10" cy="21" r="1"/><circle cx="18" cy="21" r="1"/></svg><span class="cart-count" style="display:none">0</span></button>
        <button class="hamburger" aria-label="Menu" aria-expanded="false"><span></span><span></span><span></span></button>
      </div>
    </div>
  </header>

  <section class="hero" style="min-height:40vh;padding-top:100px;padding-bottom:50px;">
    <div class="container" style="text-align:center;">
      <h1 class="section-title">Online Store</h1>
      <p class="section-subtitle">New and Ex-UK laptops from <strong style="color:var(--magenta-light)">Ksh 6,500</strong></p>
    </div>
  </section>

  <section class="section" style="padding-top:20px;">
    <div class="container">
      <p id="store-status" class="photo-guidance" role="status" aria-live="polite">Loading inventory…</p>
      <form class="admin-panel store-search" id="store-search-form" role="search">
        <h2>Find products</h2>
        <div class="store-search-grid">
          <div class="form-group">
            <label for="store-query">Search products</label>
            <input id="store-query" type="search" placeholder="Name, category, badge, or brand">
          </div>
          <div class="form-group">
            <label for="store-brand">Brand</label>
            <select id="store-brand"><option value="">All brands</option></select>
          </div>
          <div class="form-group">
            <label for="store-min-price">Minimum price (Ksh)</label>
            <input id="store-min-price" type="number" min="0" step="1" inputmode="numeric" placeholder="Any">
          </div>
          <div class="form-group">
            <label for="store-max-price">Maximum price (Ksh)</label>
            <input id="store-max-price" type="number" min="0" step="1" inputmode="numeric" placeholder="Any">
          </div>
          <div class="form-group">
            <label for="store-specs">Specifications</label>
            <input id="store-specs" type="search" placeholder="e.g. 16GB RAM, SSD, Intel i7">
          </div>
        </div>
        <div class="store-search-actions">
          <button class="btn btn-outline btn-sm" type="reset">Clear filters</button>
          <span id="store-result-count" class="photo-guidance" aria-live="polite"></span>
        </div>
      </form>
      <div class="filter-bar" id="category-filters" aria-label="Product categories"></div>
      <div class="products-grid" id="products-grid"></div>
    </div>
  </section>

  <footer class="footer"><div class="container"><div class="footer-bottom"><span>&copy; 2026 Magenta Solutions Limited.</span></div></div></footer>
  <div class="cart-overlay"></div>
  <div class="cart-sidebar">
    <div class="cart-header"><h3>Your Cart</h3><button class="cart-close">×</button></div>
    <div class="cart-items"></div>
    <div class="cart-footer"><div class="cart-total"><span>Total</span><span class="cart-total-value">Ksh 0</span></div><button class="btn btn-primary" style="width:100%" onclick="checkout()">Checkout</button></div>
  </div>
  <a class="whatsapp-float" href="https://wa.me/254703344902" target="_blank" rel="noopener noreferrer" aria-label="Chat with Paul on WhatsApp" title="Chat with Paul on WhatsApp">
    <img src="logos/whatsapp%20(1).JPEG" alt="">
  </a>
  <script src="js/main.js"></script>
  <script src="js/api-config.js"></script>
  <script src="js/categories.js"></script>
  <script src="js/store.js"></script>
</body>
</html>
